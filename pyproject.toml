[project]
name = "budget-tracker"
version = "0.1.0"
description = "Private, local-only desktop budget tracker"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
budget-tracker = "budget_tracker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
