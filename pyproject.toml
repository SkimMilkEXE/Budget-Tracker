[project]
name = "budget-tracker"
version = "0.1.0"
description = "Private, local-only desktop budget tracker"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.gui-scripts]
budget-tracker = "budget_tracker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes/pycodestyle errors (ruff's defaults) + import sorting, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Qt's `parent=QModelIndex()` default is the standard pattern and safe (immutable value)
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
